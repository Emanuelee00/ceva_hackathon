# CEVA brand theme, sourced from the official current logo (2023 mark,
# assets/ceva_logo.svg, fetched from Wikimedia Commons): navy #1d2546 and
# red #ff0000 are the exact hexes baked into that file. primaryColor below
# is stepped down from the pure logo red for WCAG AA contrast on filled
# buttons (white-on-#ff0000 is 4.0:1, under the 4.5:1 text minimum;
# #d6001c clears 5.4:1 while reading as the same hue next to the mark).
[theme]
primaryColor = "#D6001C"
backgroundColor = "#F6F6F4"
secondaryBackgroundColor = "#EEF1F5"
textColor = "#181A22"
font = "sans serif"
base = "light"

# Serves ./static/* at /app/static/* on the same port as the app — so a
# standalone mockup (e.g. ceva_landing_hero.html) is reachable through the
# one port-forwarded URL this environment already exposes, instead of a
# separate ad-hoc server on a port that isn't forwarded.
[server]
enableStaticServing = true
