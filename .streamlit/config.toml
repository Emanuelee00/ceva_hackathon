# CEVA "control room" dark theme: a deep navy operations-console
# background (#071528) with CEVA red (#E2231A, close to the official
# logo's pure #ff0000 — assets/ceva_logo_reversed.svg) reserved for
# alerts, the active step, and the primary CTA — never used as decor.
# See theme.py for the full token set (panels, hairlines, status colors)
# and where each one is used.
[theme]
base = "dark"
primaryColor = "#E2231A"
backgroundColor = "#071528"
secondaryBackgroundColor = "#0F2440"
textColor = "#FFFFFF"
font = "sans serif"

# Serves ./static/* at /app/static/* on the same port as the app — so a
# standalone mockup (e.g. ceva_landing_hero.html) is reachable through the
# one port-forwarded URL this environment already exposes, instead of a
# separate ad-hoc server on a port that isn't forwarded.
[server]
enableStaticServing = true
