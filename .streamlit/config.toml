# CEVA-style theme: deep red + navy, matching CEVA Logistics' current brand
# (dark blue + red, adopted from parent CMA CGM in 2019). Exact official hex
# codes weren't reachable (brand center / color-scraper sites blocked
# fetches) — these are a defensible approximation from multiple independent
# sources, not verified against CEVA's own brand guidelines.
[theme]
primaryColor = "#A6192E"
backgroundColor = "#FAF9F5"
secondaryBackgroundColor = "#F0ECE2"
textColor = "#17140F"
font = "sans serif"
